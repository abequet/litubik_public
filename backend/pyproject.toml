[project]
name = "litubik"
version = "1.0.0"
description = "Self-hosted, AI-assisted workbench covering the full systematic-review lifecycle, from registered protocol to PRISMA 2020"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["../LICENSE", "../NOTICE"]
readme = "../README.md"
keywords = ["systematic review", "PRISMA", "evidence synthesis", "screening",
            "research methodology"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/abequet/litubik_public"
Source = "https://github.com/abequet/litubik_public"
Issues = "https://github.com/abequet/litubik_public/issues"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests build the schema with metadata.create_all, not alembic — see
# tests/conftest.py. Migration correctness is exercised by `alembic upgrade head`
# in CI, not here.
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]
