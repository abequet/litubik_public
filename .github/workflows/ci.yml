name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest tests -q
        working-directory: backend
      # the migration chain must build a database from nothing — the exe and
      # start.bat run exactly this on first launch
      - name: alembic upgrade head on an empty database
        working-directory: backend
        run: |
          export LITUBIK_DATA_DIR="$(mktemp -d)"
          export LITUBIK_SECRET_KEY="ci-only-not-a-secret-ci-only-not-a-secret"
          python -m alembic upgrade head

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # Accessibility audit (chantier 17b): axe-core on the main pages of a seeded
  # instance, through Playwright Chromium. Fails on serious/critical findings.
  a11y:
    runs-on: ubuntu-latest
    needs: [frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_a11y_axe.py -q
        working-directory: backend
        env:
          LITUBIK_A11Y: "1"

  # Committed secrets: the whole history, on every push and pull request.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9 (third-party: pinned by commit)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Release artifact: the Windows one-click folder (on version tags only),
  # attached to a draft GitHub release that a maintainer reviews and publishes.
  windows-exe:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend-tests, frontend-build, a11y, gitleaks]
    runs-on: windows-latest
    permissions:
      contents: write  # create the draft release and upload the zip
    steps:
      - uses: actions/checkout@v4
      # the build packages every module under backend/app: nothing that is not
      # part of this repository may be present when it runs
      - name: Only the published sources are packaged
        shell: bash
        run: |
          if [ -e backend/app/services/fulltext/private ]; then
            echo "::error::backend/app/services/fulltext/private must not exist in a release build"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci && npm run build
        working-directory: frontend
        shell: bash
      - run: |
          pip install -r backend/requirements.txt "pyinstaller>=6.10"
          cd packaging
          pyinstaller --noconfirm --clean litubik.spec
        shell: bash
      # start the packaged app the way a user would, and check it serves:
      # migrations ran, the API answers, the version is the tagged one
      - name: Smoke test the executable
        shell: pwsh
        run: |
          $env:LITUBIK_NO_BROWSER = "1"
          $env:LITUBIK_PORT = "8765"
          $env:LITUBIK_DATA_DIR = Join-Path $env:RUNNER_TEMP "litubik-smoke"
          $p = Start-Process -FilePath packaging/dist/LitUbik/LitUbik.exe -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try {
              Invoke-RestMethod http://127.0.0.1:8765/api/health | Out-Null
              $ok = $true
            } catch { }
          }
          if (-not $ok) { Stop-Process -Id $p.Id -Force; throw "the executable did not answer /api/health" }
          $instance = Invoke-RestMethod http://127.0.0.1:8765/api/instance
          Stop-Process -Id $p.Id -Force
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($instance.version -ne $tag) { throw "version $($instance.version) does not match tag ${{ github.ref_name }}" }
          foreach ($f in "LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_NOTICES.txt") {
            if (-not (Test-Path "packaging/dist/LitUbik/$f")) { throw "$f missing from the build" }
          }
      - run: Compress-Archive -Path packaging/dist/LitUbik -DestinationPath "LitUbik-${{ github.ref_name }}-windows.zip"
        shell: pwsh
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2 (third-party: pinned by commit)
        with:
          files: LitUbik-${{ github.ref_name }}-windows.zip
          draft: true
