<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LitUbik</title>
    <script>
      // Dark-first, no flash: set the theme class before the first paint.
      // Default is dark; a persisted "light" choice wins.
      (function () {
        try {
          var t = localStorage.getItem('litubik-theme') || 'dark'
          document.documentElement.classList.toggle('dark', t !== 'light')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
